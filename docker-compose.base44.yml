services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.base44
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "3000:5000"
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - CELERY_DISABLED=true
      - WEASYPRINT_CACHEDIR=/tmp/weasyprint-cache
      - PYTHONUNBUFFERED=1
    env_file:
      - /run/base44/app.env
    command:
      - sh
      - -ec
      - |
        python -c "from app import create_app; from app.models import db; from app.services.subscription_service import seed_default_plans; a=create_app(); a.app_context().push(); db.create_all(); from flask_migrate import stamp; stamp(directory='migrations', revision='heads'); seed_default_plans()"
        exec flask run --host 0.0.0.0 --port 5000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: on-failure
